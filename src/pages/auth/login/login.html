<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Login - Nicolino's Food-Store</title>
  </head>

  <body>
    <section class="form-section">
      <h1>Login</h1>
      <form id="form">
        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="off"
            placeholder="example@example.com"
          />
        </div>
        <div>
          <label for="pass">Password</label>
          <input
            type="password"
            id="pass"
            name="pass"
            autocomplete="off"
            placeholder="********"
          />
        </div>

        <button type="submit">Ingresar</button>
      </form>
      <div>
        <a class="form-link" href="/src/pages/auth/registro/registro.html"
          >Registratre aqui!</a
        >
      </div>
    </section>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
